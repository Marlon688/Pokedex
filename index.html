<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body onload="init()">
    <div id="loadingScreen" class="loadingScreen">
      <img src="./assets/icons/favicon.png" alt="" />
      <p>Loading...</p>
    </div>

    <!-- ==============================
    header
    ========================= -->

    <header class="header">
      <div class="logo">
        <h1>Pokedex</h1>
        <img src="./assets/img/Pokemon-Logo.png" alt="" />
      </div>
      <div class="searchFrom">
        <input
          type="text"
          data-id="search-input"
          oninput="checkSearchInput()"
          onkeydown="if (event.key === 'Enter') searchPokemon();"
          placeholder="Search Pokemon"
          aria-label="Search Pokemon"
          minlength="3"
        />
        <button
          data-id="search-button"
          onclick="searchPokemon()"
          aria-label="Search"
        >
          Search
        </button>
        <p id="searchHint" class="searchHint hidden">min 3 letters</p>
      </div>
    </header>

    <!-- ==============================
    Main
    ========================= -->

    <main data-id="content">
      <ul id="cardList"></ul>
    </main>

    <button
      data-id="load-more-button"
      onclick="loadMorePokemon()"
      aria-label="Load more Pokemon"
    >
      Load More
    </button>

    <!-- ==============================
    Dialog
    ========================= -->

    <dialog
      class="dialog"
      data-id="dialog"
      onclick="closeDialog()"
      aria-label="Pokemon details"
    >
      <div data-id="overlay-pokemon-name" onclick="event.stopPropagation()">
        <button
          data-id="close-dialog-button"
          onclick="closeDialog()"
          aria-label="Close"
        >
          &times;
        </button>
        <div id="dialogContent"></div>
        <button
          data-id="prev-button"
          onclick="changePokemon(-1)"
          aria-label="Previous"
        >
          &lsaquo;
        </button>
        <button
          data-id="next-button"
          onclick="changePokemon(1)"
          aria-label="Next"
        >
          &rsaquo;
        </button>
      </div>
    </dialog>

    <!-- ==============================
    Footer
    ========================= -->

    <footer class="footer">
      <p>&copy; Marlon 2026</p>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
