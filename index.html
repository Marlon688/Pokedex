<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <h1>Pokedex</h1>
        <img src="./assets/img/Pokemon-Logo.png" alt="" />
      </div>
      <div class="searchFrom">
        <input
          type="text"
          data-id="search-input"
          placeholder="Search Pokemon"
          aria-label="Search Pokemon"
          minlength="3"
        />
        <button data-id="search-button" aria-label="Search">Search</button>
      </div>
    </header>

    <main data-id="content">
      <ul id="cardList">
        <li>
          <button
            class="card type-grass"
            class="card"
            data-id="card"
            aria-label="Show details for Bulbasaur"
          >
            <img
              data-id="card-image"
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/1.svg"
              alt="Bulbasaur"
            />
            <span class="cardId">#001</span>
            <span class="cardName">Bulbasaur</span>
            <span class="typeList">
              <span class="typePill">Grass</span>
              <span class="typePill">Poison</span>
            </span>
          </button>
        </li>

        <li>
          <button
            class="card type-fire"
            class="card"
            data-id="card"
            aria-label="Show details for Charmander"
          >
            <img
              data-id="card-image"
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/4.svg"
              alt="Charmander"
            />
            <span class="cardId">#004</span>
            <span class="cardName">Charmander</span>
            <span class="typeList">
              <span class="typePill">Fire</span>
            </span>
          </button>
        </li>

        <li>
          <button
            class="card type-water"
            class="card"
            data-id="card"
            aria-label="Show details for Squirtle"
          >
            <img
              data-id="card-image"
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/7.svg"
              alt="Squirtle"
            />
            <span class="cardId">#007</span>
            <span class="cardName">Squirtle</span>
            <span class="typeList">
              <span class="typePill">Water</span>
            </span>
          </button>
        </li>

        <li>
          <button
            class="card type-electric"
            class="card"
            data-id="card"
            aria-label="Show details for Pikachu"
          >
            <img
              data-id="card-image"
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/25.svg"
              alt="Pikachu"
            />
            <span class="cardId">#025</span>
            <span class="cardName">Pikachu</span>
            <span class="typeList">
              <span class="typePill">Electric</span>
            </span>
          </button>
        </li>
      </ul>
    </main>

    <button data-id="load-more-button" aria-label="Load more Pokemon">
      Load More
    </button>

    <dialog data-id="dialog" aria-label="Pokemon details">
      <div data-id="overlay-pokemon-name">
        <button data-id="close-dialog-button" aria-label="Close">
          &times;
        </button>
        <img data-id="dialog-image" src="" alt="" />
        <button data-id="prev-button" aria-label="Previous">&lsaquo;</button>
        <button data-id="next-button" aria-label="Next">&rsaquo;</button>
      </div>
    </dialog>

    <script src="./script.js"></script>
  </body>
</html>
